appId: com.morsemicro.desktopassist
productName: Desktop Assist
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
